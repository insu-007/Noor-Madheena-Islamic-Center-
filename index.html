<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Madeena Meelad Arts Fest 2026 - Result</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Cinzel+Decorative:wght@700&family=Press+Start+2P&family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Mobile Application Container -->
    <div class="mobile-container">
        
        <!-- Background Art / Decorative Elements -->
        <div class="bg-decorations">
            <!-- Central Arabic Calligraphy Watermark -->
            <div class="watermark-arabic">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M100 20C75 20 50 35 40 60C30 85 45 110 65 125C80 136 100 145 120 150C130 152 145 155 155 145C165 135 160 120 145 115C130 110 110 115 95 110C80 105 70 90 75 75C80 60 95 55 110 58C125 61 140 70 150 60C158 52 152 40 140 32C128 24 115 20 100 20Z" fill="url(#watermarkGradient)" opacity="0.12"/>
                    <circle cx="140" cy="45" r="14" fill="#9E0012" opacity="0.1"/>
                    <defs>
                        <linearGradient id="watermarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#9E0012" />
                            <stop offset="100%" stop-color="#E8A217" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <!-- Bottom Colorful Waves -->
            <div class="wave-bg">
                <svg viewBox="0 0 500 150" preserveAspectRatio="none">
                    <path d="M0,80 C150,140 350,20 500,90 L500,150 L0,150 Z" fill="#FDE8E8" opacity="0.7"></path>
                    <path d="M0,100 C200,40 300,130 500,70 L500,150 L0,150 Z" fill="#FEF3D6" opacity="0.8"></path>
                    <path d="M0,115 C120,80 380,120 500,95 L500,150 L0,150 Z" fill="#E4F5EB" opacity="0.5"></path>
                </svg>
            </div>
        </div>

        <!-- Top Header Navigation -->
        <header class="app-header">
            <!-- Left Logo -->
            <div class="logo-container" id="logoBtn">
                <svg class="fest-logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Calligraphic 'Feh' shape -->
                    <path d="M30 65 C 20 65, 15 50, 25 35 C 35 20, 55 20, 65 30 C 72 37, 75 48, 70 58 C 65 68, 50 72, 38 70 C 25 68, 15 78, 25 85 C 35 92, 65 92, 85 80" stroke="#9E0012" stroke-width="6" stroke-linecap="round" fill="none"/>
                    <path d="M45 42 C 45 35, 55 35, 55 42 C 55 50, 45 50, 45 42 Z" fill="#9E0012"/>
                    <!-- Small decorative dots & crescent wave -->
                    <path d="M15 32 L35 32 M15 38 L30 38" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="50" cy="18" r="4" fill="#E8A217"/>
                    <!-- Colorful dynamic swooshes under logo -->
                    <path d="M20 76 Q 40 86 60 76 T 90 82" stroke="#9E0012" stroke-width="3" fill="none"/>
                    <path d="M25 82 Q 45 92 65 82 T 95 86" stroke="#E8A217" stroke-width="3" fill="none"/>
                    <path d="M30 88 Q 50 98 70 88 T 98 90" stroke="#48BB78" stroke-width="2.5" fill="none"/>
                </svg>
            </div>

            <!-- Header Center Title Text -->
            <div class="header-title">
                <h1>NOOR</h1>
                <h1>MADEENA</h1>
                <h1>MEELAD</h1>
                <h1>ARTS FEST</h1>
                <div class="year-tag">2026</div>
            </div>

            <!-- Right Hamburger Menu Button -->
            <button class="menu-btn" id="menuToggleBtn" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </button>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Sparkle Icon background detail -->
            <div class="sparkle-icon">
                <svg viewBox="0 0 24 24" width="36" height="36" fill="#FFF2B2">
                    <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
                </svg>
            </div>

            <!-- Stylized "RESULT" Graphic Title -->
            <div class="result-title-container">
                <svg class="result-svg-text" viewBox="0 0 340 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Pixel/Line accurate recreation of the custom "RESULT" graphic -->
                    <!-- Color: Deep Maroon #9E0012 -->
                    <g stroke="#9E0012" stroke-width="7" stroke-linecap="square" stroke-linejoin="round" fill="none">
                        <!-- 'R' -->
                        <path d="M 22 125 V 15 H 60 C 78 15 78 52 60 52 H 22 M 52 52 L 72 125" />
                        <!-- 'e' -->
                        <path d="M 88 125 V 65 H 122 V 90 H 88 V 125 H 122" />
                        <!-- 'S' -->
                        <path d="M 166 22 H 138 V 65 H 166 V 118 H 138" />
                        <!-- 'U' -->
                        <path d="M 182 15 V 110 C 182 125 212 125 212 110 V 15" />
                        <!-- 'L' -->
                        <path d="M 228 15 V 125 H 255" />
                        <!-- 'T' -->
                        <path d="M 268 35 H 312 M 290 15 V 125 M 312 85 V 125" />
                    </g>
                </svg>
            </div>

            <!-- Red Pill "SCORE BOARD" Button -->
            <div class="scoreboard-btn-wrapper">
                <button class="btn-scoreboard" id="scoreboardBtn">
                    <span>SCORE BOARD</span>
                </button>
            </div>

            <!-- Two Main Action Pill Buttons -->
            <div class="action-buttons-group">
                <button class="btn-outline-pill" id="offStageBtn">
                    <span>OFF<br>STAGE<br>PROGRAMS</span>
                </button>

                <button class="btn-outline-pill" id="onStageBtn">
                    <span>ON<br>STAGE<br>PROGRAMS</span>
                </button>
            </div>

        </main>

        <!-- Bottom Fixed Navigation Bar -->
        <nav class="bottom-nav">
            <div class="nav-gold-line"></div>
            <div class="nav-items-wrapper">
                <button class="nav-item active" id="navHomeBtn" aria-label="Home">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>

                <button class="nav-item" id="navGalleryBtn" aria-label="Gallery">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                        <!-- Layered frame effect -->
                        <path d="M7 3h14v14" opacity="0.5"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Slide Drawer Menu -->
        <div class="drawer-overlay" id="drawerOverlay"></div>
        <div class="drawer-menu" id="drawerMenu">
            <div class="drawer-header">
                <div class="drawer-title">Fest Navigation</div>
                <button class="drawer-close-btn" id="drawerCloseBtn">&times;</button>
            </div>
            <div class="drawer-body">
                <ul class="drawer-links">
                    <li><a href="#" id="menuLinkHome"><span class="icon">🏠</span> Home Page</a></li>
                    <li><a href="#" id="menuLinkScoreboard"><span class="icon">🏆</span> Live Scoreboard</a></li>
                    <li><a href="#" id="menuLinkOffStage"><span class="icon">🎨</span> Off-Stage Programs</a></li>
                    <li><a href="#" id="menuLinkOnStage"><span class="icon">🎭</span> On-Stage Programs</a></li>
                    <li><a href="#" id="menuLinkGallery"><span class="icon">🖼️</span> Fest Gallery</a></li>
                    <li><a href="#" id="menuLinkSchedule"><span class="icon">📅</span> Program Schedule</a></li>
                    <li><a href="#" id="menuLinkTeams"><span class="icon">🚩</span> Group Standings</a></li>
                </ul>
                <div class="drawer-footer">
                    <p>Noor Madeena Meelad Arts Fest 2026</p>
                    <small>Official Results & Live Portal</small>
                </div>
            </div>
        </div>

        <!-- Fullscreen Interactive View / Modal Container -->
        <div class="modal-view" id="modalView">
            <div class="modal-header">
                <button class="modal-back-btn" id="modalBackBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <h2 class="modal-title" id="modalTitle">View Title</h2>
                <div style="width: 32px;"></div>
            </div>

            <!-- Search and Filter Bar inside Modal -->
            <div class="search-bar-container" id="searchBarContainer">
                <input type="text" id="searchInput" placeholder="Search program, student, chest no..." />
                <span class="search-icon">🔍</span>
            </div>

            <!-- Modal Dynamic Content Body -->
            <div class="modal-body" id="modalBody">
                <!-- Dynamic Content Loaded via JS -->
            </div>
        </div>

    </div>

    <!-- JavaScript Source Code -->
    <script src="script.js"></script>
</body>
</html>
